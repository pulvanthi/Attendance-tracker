# Render Blueprint: creates the FastAPI backend + a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: trackpulse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: trackpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Render asks for these two when you create the Blueprint:
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false   # e.g. ["https://your-app.vercel.app"]

databases:
  - name: trackpulse-db
    plan: free
    databaseName: attendance_db
